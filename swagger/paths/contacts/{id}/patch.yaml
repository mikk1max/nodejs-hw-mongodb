tags:
  - Contacts
summary: Edit contact
operationId: patchContact
description: 'Edit a contact with payload'
security:
  - bearerAuth: [ ]
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '681381cf82909614cd598f3e'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380662223344'
          contactType:
            description: "Contact's type"
            type: string
            enum: [ 'personal', 'home', 'work' ]
          email:
            description: "Contact's email address"
            type: string
            example: 'd.melnyk@example.com'
          isFavourite:
            description: 'Is student favourite'
            type: boolean
            example: false
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Edit a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: "../../../components/schemas/contact.yaml"
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
